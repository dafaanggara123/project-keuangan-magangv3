<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>Dapoersari Owner — Analytics & Finance</title>
    <link rel="icon" href="/favicon-dapoersari.png" />

    <!-- Google Fonts: non-blocking async load -->
    <!-- preconnect mempercepat DNS + TLS handshake -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media="print" → onload trick: font dimuat async, tidak blocking render -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback untuk browser tanpa JS -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
